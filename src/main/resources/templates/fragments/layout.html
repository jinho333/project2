<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<!--
  공통 레이아웃 조각(fragment) 모음 - 모든 페이지가 th:replace 로 필요한 부분만 가져다 씀
  head(title)        : <head> 영역 (탭 제목, CSS)
  sidebar(active)    : [DEPRECATED] 더 이상 사이드바를 쓰지 않음 - 호출돼도 아무 것도 렌더되지 않음
  topbar(title,active): 상단 바 (로고 + 메뉴 네비 + 검색)
  scripts            : 모든 페이지 공통 JS
-->
<!-- [head] 사용 예: th:replace="~{fragments/layout :: head('지역 상세 통계')}" -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | 도시가스 공급 대시보드'">도시가스 공급 대시보드</title>
    <!-- CSS 순서 중요: tokens(색·크기 변수) → common(공통 부품) → dashboard(대시보드 전용) -->
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<!-- [sidebar] 더 이상 사용 안 함 - 호환성 위해 fragment만 비워둠 -->
<th:block th:fragment="sidebar(active)"></th:block>

<!-- [topbar] 로고 + 네비게이션 메뉴 + 데이터 기간 표시
     active : 'region' / 'national' / 'forecast' 중 하나 → 해당 메뉴가 하이라이트됨 -->
<header class="topbar" th:fragment="topbar(title, active)">
    <div class="topbar-brand">
        <img th:src="@{/images/logo.png}" alt="kg 로고" class="brand-logo">
    </div>
    <nav class="topbar-nav">
        <a class="nav-item" th:href="@{/region}"   th:classappend="${active == 'region'}   ? 'is-active'"><i data-lucide="map-pin"></i><span>지역 상세</span></a>
        <a class="nav-item" th:href="@{/national}" th:classappend="${active == 'national'} ? 'is-active'"><i data-lucide="layout-grid"></i><span>전국 통계</span></a>
        <a class="nav-item" th:href="@{/forecast}" th:classappend="${active == 'forecast'} ? 'is-active'"><i data-lucide="trending-up"></i><span>공급 예측</span></a>
    </nav>
    <div class="spacer"></div>
    <!-- 데이터 기간 안내 (검색창과 같은 투명 박스 스타일) -->
    <div class="topbar-info">데이터 기간 : 2021-01 ~ 2026-06</div>
</header>

<!-- [scripts] 로드 순서 중요: 서버 값 → axios·Chart.js·아이콘 → common.js(Dash) → (각 페이지 js) -->
<th:block th:fragment="scripts">
    <script th:inline="javascript">
        window.CTX = /*[[@{/}]]*/ '/';
        window.INITIAL_REGION = /*[[${regionId}]]*/ null;
    </script>
    <!-- 외부 라이브러리: axios(서버 요청), Chart.js(차트), lucide(아이콘) -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <!-- 공통 함수 + API 목록(맨 위 주석) -->
    <script th:src="@{/js/common.js}"></script>
</th:block>

</body>
</html>
